<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com tabelas em HTML</title>
</head>
<body>
    <h2>Estrutura Básica de Uma Tabela em HTML</h2>

    <table border="1">
        <tr>
            <th colspan="3">Lista de Usuários</th>
        </tr>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Ana</td>
            <td>28</td>
            <td>São Paulo</td>
        </tr>
        <tr>
            <td>Lucas</td>
            <td>34</td>
            <td>Rio de janeiro</td>
        </tr>

    </table>



    
</body>
</html>
